<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAJBOOR ❤️</title>

    <style>

        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --love-red: #b3123b;
            --deep-red: #430615;
            --rose: #ff4f83;
            --soft-pink: #ff9dbd;
            --gold: #e8c77a;
            --white: #fff4f7;
            --black: #050205;

            --serif: Georgia, "Times New Roman", serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {

            min-height: 100vh;

            overflow-x: hidden;

            position: relative;

            isolation: isolate;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px;

            background:

                radial-gradient(
                    circle at 50% 35%,
                    rgba(255, 74, 126, 0.20),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 10% 20%,
                    rgba(190, 20, 70, 0.25),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 90% 80%,
                    rgba(255, 90, 145, 0.16),
                    transparent 28%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(130, 0, 40, 0.28),
                    transparent 40%
                ),

                linear-gradient(
                    135deg,
                    #070207,
                    #22030d,
                    #090207,
                    #350513,
                    #050205
                );

            color: var(--white);

            font-family: var(--serif);
        }


        /* =========================================================
           CINEMATIC LIGHT
        ========================================================= */

        body::before {

            content: "";

            position: fixed;

            inset: -30%;

            z-index: -5;

            background:

                radial-gradient(
                    ellipse at 30% 35%,
                    rgba(255, 65, 120, 0.18),
                    transparent 25%
                ),

                radial-gradient(
                    ellipse at 70% 65%,
                    rgba(185, 15, 65, 0.18),
                    transparent 25%
                ),

                radial-gradient(
                    ellipse at 50% 50%,
                    rgba(255, 180, 205, 0.06),
                    transparent 35%
                );

            filter: blur(50px);

            animation: cinematicBreath 12s ease-in-out infinite alternate;
        }


        @keyframes cinematicBreath {

            0% {
                transform: translate3d(-5%, -4%, 0) scale(1);
            }

            50% {
                transform: translate3d(4%, 3%, 0) scale(1.08);
            }

            100% {
                transform: translate3d(-2%, 5%, 0) scale(1.03);
            }
        }


        /* =========================================================
           FILM GRAIN
        ========================================================= */

        body::after {

            content: "";

            position: fixed;

            inset: -100%;

            z-index: 20;

            pointer-events: none;

            opacity: 0.055;

            background-image:

                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='.8'/%3E%3C/svg%3E");

            animation: grainMove 0.25s steps(2) infinite;
        }


        @keyframes grainMove {

            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(3%, -2%);
            }

            50% {
                transform: translate(-2%, 3%);
            }

            75% {
                transform: translate(2%, 2%);
            }

            100% {
                transform: translate(-3%, -2%);
            }
        }


        /* =========================================================
           ROMANTIC ORBS
        ========================================================= */

        .orb {

            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            z-index: -3;

            filter: blur(35px);

            opacity: 0.45;

            mix-blend-mode: screen;
        }


        .orb.one {

            width: 300px;

            height: 300px;

            left: -100px;

            top: 5%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 43, 101, 0.65),
                    transparent 70%
                );

            animation: orbOne 16s ease-in-out infinite alternate;
        }


        .orb.two {

            width: 380px;

            height: 380px;

            right: -150px;

            bottom: 5%;

            background:
                radial-gradient(
                    circle,
                    rgba(180, 0, 70, 0.55),
                    transparent 70%
                );

            animation: orbTwo 20s ease-in-out infinite alternate;
        }


        .orb.three {

            width: 240px;

            height: 240px;

            left: 40%;

            bottom: -100px;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 120, 165, 0.35),
                    transparent 70%
                );

            animation: orbThree 14s ease-in-out infinite alternate;
        }


        @keyframes orbOne {

            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(180px, 120px) scale(1.3);
            }

            100% {
                transform: translate(80px, 280px) scale(0.9);
            }
        }


        @keyframes orbTwo {

            0% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-180px, -100px) scale(1.25);
            }

            100% {
                transform: translate(-80px, -250px) scale(0.9);
            }
        }


        @keyframes orbThree {

            0% {
                transform: translateX(-100px);
            }

            100% {
                transform: translateX(160px) translateY(-120px);
            }
        }


        /* =========================================================
           VIDEO CONTAINER
        ========================================================= */

        .video-container {

            width: min(1000px, 95vw);

            position: relative;

            padding: 55px 45px 40px;

            overflow: hidden;

            border-radius: 30px;

            background:

                linear-gradient(
                    135deg,
                    rgba(70, 3, 22, 0.60),
                    rgba(10, 3, 8, 0.70),
                    rgba(110, 7, 40, 0.45)
                );

            border: 1px solid rgba(255, 157, 189, 0.20);

            backdrop-filter:
                blur(12px)
                saturate(125%);

            -webkit-backdrop-filter:
                blur(12px)
                saturate(125%);

            box-shadow:

                0 30px 100px rgba(0, 0, 0, 0.70),

                0 0 80px rgba(180, 15, 70, 0.18),

                inset 0 0 80px rgba(255, 60, 120, 0.04);

            animation:
                containerReveal 1.8s cubic-bezier(.16, 1, .3, 1) both;
        }


        @keyframes containerReveal {

            0% {
                opacity: 0;
                transform: translateY(40px) scale(0.97);
                filter: blur(12px);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
                filter: blur(0);
            }
        }


        /* =========================================================
           MOVING BORDER
        ========================================================= */

        .video-container::after {

            content: "";

            position: absolute;

            inset: 0;

            border-radius: inherit;

            padding: 1px;

            background:

                linear-gradient(
                    120deg,
                    transparent,
                    rgba(255, 89, 137, 0.5),
                    transparent,
                    rgba(232, 199, 122, 0.4),
                    transparent
                );

            background-size: 300% 300%;

            animation: borderFlow 8s linear infinite;

            pointer-events: none;

            mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);

            mask-composite: exclude;

            -webkit-mask:
                linear-gradient(#000 0 0) content-box,
                linear-gradient(#000 0 0);

            -webkit-mask-composite: xor;
        }


        @keyframes borderFlow {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }


        /* =========================================================
           TOP LABEL
        ========================================================= */

        .top-label {

            text-align: center;

            letter-spacing: 7px;

            text-transform: uppercase;

            font-size: 11px;

            color: rgba(255, 220, 230, 0.65);

            margin-bottom: 18px;

            animation: fadeDown 1.5s ease both;

            text-shadow:
                0 0 15px rgba(255, 100, 150, 0.5);
        }


        @keyframes fadeDown {

            from {
                opacity: 0;
                transform: translateY(-15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================================================
           TITLE
        ========================================================= */

        .title {

            text-align: center;

            font-size: clamp(55px, 10vw, 125px);

            line-height: 0.9;

            font-weight: 700;

            letter-spacing: 15px;

            margin-left: 15px;

            background:

                linear-gradient(
                    120deg,
                    #ffffff,
                    #ff9fbe,
                    #ffffff,
                    #e8c77a,
                    #ff709f,
                    #ffffff
                );

            background-size: 300% auto;

            -webkit-background-clip: text;

            background-clip: text;

            color: transparent;

            text-shadow:

                0 0 15px rgba(255, 70, 125, 0.25),

                0 0 50px rgba(255, 40, 110, 0.15);

            animation:
                loveTitle 7s ease-in-out infinite,
                titleReveal 1.8s cubic-bezier(.16, 1, .3, 1) both;
        }


        @keyframes loveTitle {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }


        @keyframes titleReveal {

            from {
                opacity: 0;
                letter-spacing: 35px;
                filter: blur(12px);
            }

            to {
                opacity: 1;
                letter-spacing: 15px;
                filter: blur(0);
            }
        }


        /* =========================================================
           LOVE LINE
        ========================================================= */

        .love-line {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 18px;

            margin: 28px auto 30px;

            width: 70%;

            opacity: 0.85;
        }


        .love-line .line {

            height: 1px;

            flex: 1;

            background:

                linear-gradient(
                    to right,
                    transparent,
                    rgba(255, 145, 175, 0.75)
                );

            box-shadow:
                0 0 12px rgba(255, 80, 130, 0.4);
        }


        .love-line .line.right {

            background:

                linear-gradient(
                    to left,
                    transparent,
                    rgba(255, 145, 175, 0.75)
                );
        }


        .min-heart {

            font-size: 17px;

            color: #ff6b9a;

            filter:
                drop-shadow(
                    0 0 8px rgba(255, 80, 130, 0.8)
                );

            animation: heartbeat 1.8s ease-in-out infinite;
        }


        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1);
            }

            15% {
                transform: scale(1.25);
            }

            30% {
                transform: scale(1);
            }

            45% {
                transform: scale(1.18);
            }

            60% {
                transform: scale(1);
            }
        }


        /* =========================================================
           VIDEO FRAME
        ========================================================= */

        .video-frame {

            position: relative;

            overflow: hidden;

            border-radius: 20px;

            background:

                linear-gradient(
                    135deg,
                    rgba(255, 80, 130, 0.08),
                    rgba(0, 0, 0, 0.45),
                    rgba(232, 199, 122, 0.05)
                );

            border: 1px solid rgba(255, 180, 200, 0.18);

            box-shadow:

                0 20px 60px rgba(0, 0, 0, 0.65),

                inset 0 0 50px rgba(255, 50, 120, 0.08);

            isolation: isolate;

            animation: videoReveal 2s 0.35s ease both;
        }


        @keyframes videoReveal {

            from {
                opacity: 0;
                transform: scale(0.97);
                filter: blur(8px);
            }

            to {
                opacity: 1;
                transform: scale(1);
                filter: blur(0);
            }
        }


        /* =========================================================
           VIDEO LIGHT REFLECTION
        ========================================================= */

        .video-frame::before {

            content: "";

            position: absolute;

            top: -50%;

            left: -30%;

            width: 30%;

            height: 200%;

            z-index: 3;

            pointer-events: none;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 190, 215, 0.12),
                    transparent
                );

            transform: rotate(18deg);

            animation: videoReflection 8s ease-in-out infinite;
        }


        @keyframes videoReflection {

            0% {
                left: -40%;
                opacity: 0;
            }

            15% {
                opacity: 1;
            }

            40% {
                left: 120%;
                opacity: 0;
            }

            100% {
                left: 120%;
                opacity: 0;
            }
        }


        /* =========================================================
           VIDEO
        ========================================================= */

        video {

            display: block;

            width: 100%;

            max-height: 70vh;

            object-fit: contain;

            background: rgba(0, 0, 0, 0.20);

            opacity: 0.91;

            filter:

                saturate(1.08)

                contrast(1.04)

                brightness(0.92);

            transition:

                opacity 0.7s ease,

                filter 0.7s ease,

                transform 0.8s ease;
        }


        .video-frame:hover video {

            opacity: 0.97;

            filter:

                saturate(1.12)

                contrast(1.05)

                brightness(0.98);

            transform: scale(1.008);
        }


        /* =========================================================
           BOTTOM TEXT
        ========================================================= */

        .bottom-text {

            text-align: center;

            margin-top: 30px;

            font-size: clamp(14px, 2vw, 18px);

            line-height: 1.8;

            color: rgba(255, 228, 236, 0.78);

            letter-spacing: 1px;

            max-width: 720px;

            margin-left: auto;

            margin-right: auto;

            text-shadow:
                0 2px 20px rgba(0, 0, 0, 0.7);

            animation:
                bottomReveal 1.8s 0.7s ease both;
        }


        @keyframes bottomReveal {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* =========================================================
           CORNER DECORATION
        ========================================================= */

        .corner {

            position: absolute;

            width: 45px;

            height: 45px;

            pointer-events: none;

            opacity: 0.5;
        }


        .corner.one {

            top: 20px;

            left: 20px;

            border-top: 1px solid rgba(255, 150, 180, 0.5);

            border-left: 1px solid rgba(255, 150, 180, 0.5);
        }


        .corner.two {

            top: 20px;

            right: 20px;

            border-top: 1px solid rgba(255, 150, 180, 0.5);

            border-right: 1px solid rgba(255, 150, 180, 0.5);
        }


        .corner.three {

            bottom: 20px;

            left: 20px;

            border-bottom: 1px solid rgba(232, 199, 122, 0.4);

            border-left: 1px solid rgba(232, 199, 122, 0.4);
        }


        .corner.four {

            bottom: 20px;

            right: 20px;

            border-bottom: 1px solid rgba(232, 199, 122, 0.4);

            border-right: 1px solid rgba(232, 199, 122, 0.4);
        }


        /* =========================================================
           FLOATING GOLD / ROMANTIC DUST
        ========================================================= */

        .star {

            position: fixed;

            width: 3px;

            height: 3px;

            border-radius: 50%;

            background: #ffd8e5;

            box-shadow:

                0 0 8px rgba(255, 120, 165, 0.9),

                0 0 18px rgba(255, 80, 130, 0.5);

            z-index: -1;

            pointer-events: none;

            animation: romanticDust linear infinite;
        }


        .s1 {
            left: 8%;
            top: 80%;
            animation-duration: 9s;
        }

        .s2 {
            left: 18%;
            top: 60%;
            animation-duration: 12s;
        }

        .s3 {
            left: 30%;
            top: 90%;
            animation-duration: 10s;
        }

        .s4 {
            left: 45%;
            top: 75%;
            animation-duration: 14s;
        }

        .s5 {
            left: 60%;
            top: 85%;
            animation-duration: 11s;
        }

        .s6 {
            left: 73%;
            top: 65%;
            animation-duration: 13s;
        }

        .s7 {
            left: 82%;
            top: 88%;
            animation-duration: 10s;
        }

        .s8 {
            left: 92%;
            top: 55%;
            animation-duration: 15s;
        }

        .s9 {
            left: 52%;
            top: 95%;
            animation-duration: 12s;
        }


        @keyframes romanticDust {

            0% {

                transform:
                    translate3d(0, 40px, 0)
                    scale(0.5);

                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            50% {

                transform:
                    translate3d(35px, -40vh, 0)
                    scale(1.2);

                opacity: 1;
            }

            100% {

                transform:
                    translate3d(-30px, -100vh, 0)
                    scale(0.3);

                opacity: 0;
            }
        }


        /* =========================================================
           FLOATING HEARTS
        ========================================================= */

        .heart {

            position: fixed;

            z-index: -1;

            pointer-events: none;

            color: rgba(255, 85, 135, 0.65);

            font-size: 22px;

            text-shadow:

                0 0 8px rgba(255, 50, 120, 0.9),

                0 0 20px rgba(255, 50, 120, 0.5);

            animation:
                hollywoodHeart linear infinite;
        }


        .h1 {
            left: 8%;
            bottom: -30px;
            animation-duration: 13s;
        }

        .h2 {
            left: 22%;
            bottom: -40px;
            animation-duration: 17s;
            animation-delay: 2s;
        }

        .h3 {
            left: 38%;
            bottom: -30px;
            animation-duration: 15s;
            animation-delay: 4s;
        }

        .h4 {
            left: 54%;
            bottom: -40px;
            animation-duration: 18s;
            animation-delay: 1s;
        }

        .h5 {
            left: 68%;
            bottom: -30px;
            animation-duration: 14s;
            animation-delay: 3s;
        }

        .h6 {
            left: 78%;
            bottom: -50px;
            animation-duration: 16s;
            animation-delay: 5s;
        }

        .h7 {
            left: 88%;
            bottom: -30px;
            animation-duration: 19s;
            animation-delay: 2s;
        }

        .h8 {
            left: 47%;
            bottom: -50px;
            animation-duration: 20s;
            animation-delay: 6s;
        }


        @keyframes hollywoodHeart {

            0% {

                transform:
                    translate3d(0, 0, 0)
                    scale(0.5)
                    rotate(-5deg);

                opacity: 0;
            }

            10% {
                opacity: 0.65;
            }

            30% {

                transform:
                    translate3d(25px, -25vh, 0)
                    scale(0.9)
                    rotate(8deg);
            }

            60% {

                transform:
                    translate3d(-30px, -60vh, 0)
                    scale(1.15)
                    rotate(-8deg);
            }

            100% {

                transform:
                    translate3d(30px, -110vh, 0)
                    scale(0.6)
                    rotate(12deg);

                opacity: 0;
            }
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 800px) {

            body {
                padding: 20px 12px;
            }

            .video-container {

                width: 100%;

                padding:
                    40px 18px 30px;

                border-radius: 22px;
            }

            .title {

                font-size: clamp(45px, 15vw, 80px);

                letter-spacing: 8px;

                margin-left: 8px;
            }

            .love-line {

                width: 85%;

                margin-top: 22px;

                margin-bottom: 22px;
            }

            .video-frame {

                border-radius: 15px;
            }

            .bottom-text {

                font-size: 14px;

                line-height: 1.7;
            }

            .corner {

                width: 30px;

                height: 30px;
            }
        }


        /* =========================================================
           SMALL PHONES
        ========================================================= */

        @media (max-width: 480px) {

            .video-container {

                padding:
                    35px 12px 25px;
            }

            .top-label {

                font-size: 8px;

                letter-spacing: 4px;
            }

            .title {

                font-size: 48px;

                letter-spacing: 5px;
            }

            .love-line {

                gap: 10px;
            }

            .min-heart {

                font-size: 14px;
            }

            .bottom-text {

                padding: 0 5px;

                font-size: 13px;
            }

            video {

                opacity: 0.92;
            }
        }


        /* =========================================================
           REDUCED MOTION
        ========================================================= */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration: 0.01ms !important;

                animation-iteration-count: 1 !important;

                scroll-behavior: auto !important;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================================
         ROMANTIC BACKGROUND ORBS
    ========================================================= -->

    <div class="orb one"></div>

    <div class="orb two"></div>

    <div class="orb three"></div>

    <div class="orb four"></div>


    <!-- =========================================================
         FLOATING ROMANTIC DUST
    ========================================================= -->

    <div class="star s1"></div>
    <div class="star s2"></div>
    <div class="star s3"></div>
    <div class="star s4"></div>
    <div class="star s5"></div>
    <div class="star s6"></div>
    <div class="star s7"></div>
    <div class="star s8"></div>
    <div class="star s9"></div>


    <!-- =========================================================
         FLOATING HEARTS
    ========================================================= -->

    <div class="heart h1">♥</div>
    <div class="heart h2">♥</div>
    <div class="heart h3">♥</div>
    <div class="heart h4">♥</div>
    <div class="heart h5">♥</div>
    <div class="heart h6">♥</div>
    <div class="heart h7">♥</div>
    <div class="heart h8">♥</div>


    <!-- =========================================================
         MAIN CONTENT
    ========================================================= -->

    <main class="video-container">


        <!-- Corner decorations -->

        <div class="corner one"></div>
        <div class="corner two"></div>
        <div class="corner three"></div>
        <div class="corner four"></div>


        <!-- Top label -->

        <div class="top-label">
            A STORY WRITTEN IN LOVE
        </div>


        <!-- Main title -->

        <div class="title">
            MAJBOOR 
            
        </div>


        <!-- Love destiny line -->

        <div class="love-line">

            <div class="line"></div>

            <div class="min-heart">
               NEVER FALL IN ♥ LOVE
            </div>

            <div class="line right"></div>

        </div>


        <!-- =====================================================
             VIDEO
        ====================================================== -->

        <div class="video-frame">

            <video
                controls
                playsinline
                preload="metadata"
            >

                <source
                    src="Majboor.mp4"
                    type="video/mp4"
                >

                Your browser does not support the video tag.

            </video>

        </div>


        <!-- =====================================================
             BOTTOM TEXT
        ====================================================== -->

        <div class="bottom-text">

            Some stories are not written by choice,
            they are written by destiny. ❤️

        </div>


    </main>


</body>

</html>
